basePath: /
definitions:
  bot.BotDAO:
    properties:
      botID:
        type: string
      createdAt:
        type: string
      customerId:
        type: string
      id:
        type: string
      integrationsKey:
        type: string
      returnChatToBot:
        type: boolean
      salesdeskAccountID:
        type: string
      updatedAt:
        type: string
      webhookMetadata:
        $ref: '#/definitions/bot.WebhookMetadata'
      workflowEndpoint:
        type: string
    type: object
  bot.BotDTO:
    properties:
      botID:
        type: string
      createdAt:
        type: string
      customerId:
        type: string
      customerName:
        type: string
      id:
        type: string
      integrationsKey:
        type: string
      returnChatToBot:
        type: boolean
      salesdeskAccountID:
        type: string
      updatedAt:
        type: string
      webhookMetadata:
        $ref: '#/definitions/bot.WebhookMetadata'
      workflowEndpoint:
        type: string
    type: object
  bot.InsertBotDTO:
    properties:
      botId:
        type: string
      returnChatToBot:
        type: boolean
      salesdeskAccountId:
        type: string
      webhookMetadata:
        $ref: '#/definitions/bot.WebhookMetadata'
      workflowEndpoint:
        type: string
    required:
    - botId
    - salesdeskAccountId
    type: object
  bot.UpdateBotWebhookResponse:
    properties:
      webhook:
        type: string
    type: object
  bot.WebhookMetadata:
    properties:
      chatBacklogInHours:
        type: integer
      messagesPerRequest:
        type: integer
      phone:
        type: string
      webhook:
        type: string
    type: object
  models.NamedError:
    properties:
      name:
        type: string
      reason:
        type: string
    type: object
  models.TemplateData:
    properties:
      isActiveSalesdesk:
        type: boolean
      sharedWith:
        items:
          type: string
        type: array
    type: object
  template.SyncTemplatesErrorResponse:
    properties:
      errors:
        items:
          $ref: '#/definitions/models.NamedError'
        type: array
      success:
        type: boolean
    type: object
  template.TemplateDAO:
    properties:
      bodyText:
        type: string
      createdAt:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      isActiveSalesdesk:
        type: boolean
      name:
        type: string
      sharedWith:
        items:
          type: integer
        type: array
      status:
        type: string
      subscriptionID:
        type: string
      updatedAt:
        type: string
    type: object
  template.TemplatePaginatedDTO:
    properties:
      count:
        type: integer
      offset:
        type: integer
      templates:
        items:
          $ref: '#/definitions/template.TemplateDAO'
        type: array
      total:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the Salesdesk API
  title: Salesdesk API
  version: "1.0"
paths:
  /v1/bot:
    get:
      description: Returns bot info for the given Instance (AccountID)
      operationId: getBotByInstance
      parameters:
      - description: Instance (AccountID)
        in: query
        name: instance
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bot.BotDTO'
        "404":
          description: No Bot Found for given Instance
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      tags:
      - Bot
    post:
      description: Add new bot to salesdesk
      operationId: addNewBot
      parameters:
      - description: New bot values
        in: body
        name: InsertBotRequest
        required: true
        schema:
          $ref: '#/definitions/bot.InsertBotDTO'
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Missing or Invalid body Inputs
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      tags:
      - Bot
  /v1/bot/{botId}:
    delete:
      description: Removes bot from integrations webhook
      operationId: deleteBotById
      parameters:
      - description: Bot ID
        in: path
        name: botId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: string
        "404":
          description: Bot not found for given BotID
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      tags:
      - Bot
    get:
      description: Returns bot info for the given BotID
      operationId: getBotById
      parameters:
      - description: Bot ID
        in: path
        name: botId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bot.BotDTO'
        "404":
          description: No Bot Found for given BotID
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      tags:
      - Bot
  /v1/bot/{botId}/webhook:
    post:
      description: Update Bot Webhook data
      operationId: updateBotWebhook
      parameters:
      - description: Bot ID
        in: path
        name: botId
        required: true
        type: string
      - description: New webhook data values
        in: body
        name: UpdateBotWebhookRequest
        required: true
        schema:
          $ref: '#/definitions/bot.WebhookMetadata'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bot.UpdateBotWebhookResponse'
        "400":
          description: Missing or Invalid path/body Inputs
          schema:
            type: string
        "401":
          description: Missing authorization token in header
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      tags:
      - Bot
  /v1/bot/all:
    get:
      description: Returns all bots info
      operationId: getAllBots
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/bot.BotDAO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      tags:
      - Bot
  /v1/sync:
    get:
      description: Sync the Salesdesk template data with the data from engagement.
        It will get all botIds in our DB and update out of sync templates in Engagement
        for that given BotIds
      operationId: syncTemplates
      responses:
        "200":
          description: Synchronization completed successfully
          schema:
            type: string
      tags:
      - Template
  /v1/template:
    get:
      description: Returns a list of templates for a given account and departments
        that matches a search string
      operationId: getTemplates
      parameters:
      - description: Account ID
        in: query
        name: accountId
        required: true
        type: string
      - description: Departments IDs, separated by comma
        in: query
        name: departmentsIds
        type: string
      - description: Search term
        in: query
        name: search
        type: string
      - description: 'Boolean value: whether the templates to be searched are active
          or not. Deafult false'
        in: query
        name: isActiveSalesdesk
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/template.TemplatePaginatedDTO'
        "400":
          description: Missing AccountId input
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      tags:
      - Template
  /v1/template/{id}:
    get:
      description: Get template by ID
      operationId: getTemplate
      parameters:
      - description: The template ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Boolean value: If ''true'' it will return additional information
          from engagement about this template'
        in: query
        name: full
        required: true
        type: boolean
      responses:
        "200":
          description: Returned Template
          schema: {}
        "400":
          description: Unable to get template for given id
          schema:
            type: string
        "404":
          description: Not Found template for given id
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      tags:
      - Template
    put:
      description: Update template custom fields
      operationId: updateTemplate
      parameters:
      - description: The template ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Template body params
        in: body
        name: TemplateUpdateRequest
        required: true
        schema:
          $ref: '#/definitions/models.TemplateData'
      responses:
        "200":
          description: Template updated successfully
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      tags:
      - Template
  /v2/bot:
    get:
      description: Returns all bots info for the given Instance (AccountID)
      operationId: getBotsByInstance
      parameters:
      - description: Instance (AccountID)
        in: query
        name: instance
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/bot.BotDAO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      tags:
      - Bot
swagger: "2.0"
